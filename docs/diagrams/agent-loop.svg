<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Agent loop</title>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker>
</defs>
<rect width="1400" height="700" fill="#ffffff"/>
<text x="700" y="44" text-anchor="middle" font-size="28" font-weight="700" fill="#1d2433">Inside the agent: how one briefing is made</text><rect x="40" y="110" width="260" height="90" rx="14" fill="#e7edff" stroke="#3b5bdb" stroke-width="2.5"/><text x="170.0" y="149.0" text-anchor="middle" font-size="21" font-weight="700" fill="#1d2433">1. Your input</text><text x="170.0" y="173.0" text-anchor="middle" font-size="15" fill="#495057">city + interests</text><rect x="380" y="110" width="300" height="90" rx="14" fill="#efe9ff" stroke="#6741d9" stroke-width="2.5"/><text x="530.0" y="149.0" text-anchor="middle" font-size="21" font-weight="700" fill="#1d2433">2. Lambda code asks the AI</text><text x="530.0" y="173.0" text-anchor="middle" font-size="15" fill="#495057">sends your input + a list</text><text x="530.0" y="191.0" text-anchor="middle" font-size="15" fill="#495057">of tools it may use</text><rect x="760" y="110" width="260" height="90" rx="14" fill="#fff1e0" stroke="#e8590c" stroke-width="2.5"/><text x="890.0" y="149.0" text-anchor="middle" font-size="21" font-weight="700" fill="#1d2433">3. The AI decides</text><text x="890.0" y="173.0" text-anchor="middle" font-size="15" fill="#495057">tool needed, or ready?</text><line x1="300" y1="155" x2="378" y2="155" stroke="#495057" stroke-width="2.5" marker-end="url(#a)"/><line x1="680" y1="155" x2="758" y2="155" stroke="#495057" stroke-width="2.5" marker-end="url(#a)"/><rect x="760" y="300" width="260" height="110" rx="14" fill="#e6f7ec" stroke="#2b8a3e" stroke-width="2.5"/><text x="890.0" y="349.0" text-anchor="middle" font-size="21" font-weight="700" fill="#1d2433">4. Our code runs the tool</text><text x="890.0" y="373.0" text-anchor="middle" font-size="15" fill="#495057">get_weather, get_news</text><text x="890.0" y="391.0" text-anchor="middle" font-size="15" fill="#495057">or filter_by_interest</text><line x1="890" y1="202" x2="890" y2="298" stroke="#495057" stroke-width="2.5" marker-end="url(#a)"/><text x="985" y="255" text-anchor="middle" font-size="14" fill="#343a40" font-style="italic">"I need a tool"</text><path d="M 1022,355 L 1080,355 L 1080,155 L 1022,155" fill="none" stroke="#495057" stroke-width="2.5" marker-end="url(#a)"/><text x="1100" y="245" text-anchor="start" font-size="15" font-weight="400" fill="#343a40">send the result back</text><text x="1100" y="266" text-anchor="start" font-size="15" font-weight="400" fill="#343a40">and ask again</text><text x="1100" y="295" text-anchor="start" font-size="15" font-weight="700" fill="#c0233a">repeat, at most 6 rounds</text><rect x="380" y="300" width="300" height="110" rx="14" fill="#fff1e0" stroke="#e8590c" stroke-width="2.5"/><text x="530.0" y="349.0" text-anchor="middle" font-size="21" font-weight="700" fill="#1d2433">5. The AI writes the briefing</text><text x="530.0" y="373.0" text-anchor="middle" font-size="15" fill="#495057">greeting, weather,</text><text x="530.0" y="391.0" text-anchor="middle" font-size="15" fill="#495057">news grouped by interest</text><line x1="758" y1="175" x2="682" y2="330" stroke="#495057" stroke-width="2.5" marker-end="url(#a)"/><text x="668" y="270" text-anchor="middle" font-size="14" fill="#343a40" font-style="italic">"I'm ready"</text><rect x="380" y="490" width="300" height="130" rx="14" fill="#efe9ff" stroke="#6741d9" stroke-width="2.5"/><text x="530.0" y="549.0" text-anchor="middle" font-size="21" font-weight="700" fill="#1d2433">6. Code cleans it up</text><text x="530.0" y="573.0" text-anchor="middle" font-size="15" fill="#495057">hides anything that looks like</text><text x="530.0" y="591.0" text-anchor="middle" font-size="15" fill="#495057">a secret, adds "unavailable"</text><text x="530.0" y="609.0" text-anchor="middle" font-size="15" fill="#495057">notes if a source failed</text><line x1="530" y1="412" x2="530" y2="488" stroke="#495057" stroke-width="2.5" marker-end="url(#a)"/><rect x="40" y="490" width="260" height="130" rx="14" fill="#e6f7ec" stroke="#2b8a3e" stroke-width="2.5"/><text x="170.0" y="549.0" text-anchor="middle" font-size="21" font-weight="700" fill="#1d2433">7. Deliver + record</text><text x="170.0" y="573.0" text-anchor="middle" font-size="15" fill="#495057">show on the page or email it,</text><text x="170.0" y="591.0" text-anchor="middle" font-size="15" fill="#495057">write the audit log row</text><line x1="378" y1="555" x2="302" y2="555" stroke="#495057" stroke-width="2.5" marker-end="url(#a)"/><rect x="760" y="470" width="600" height="190" rx="14" fill="#f8f9fb" stroke="#ced4da" stroke-width="2"/><text x="785" y="502" text-anchor="start" font-size="18" font-weight="700" fill="#1d2433">A normal run (3 rounds)</text><text x="785" y="534" text-anchor="start" font-size="16" font-weight="400" fill="#343a40">Round 1: AI asks for the weather and the news.</text><text x="785" y="562" text-anchor="start" font-size="16" font-weight="400" fill="#343a40">Round 2: AI asks to filter the news by your interests.</text><text x="785" y="590" text-anchor="start" font-size="16" font-weight="400" fill="#343a40">Round 3: AI has everything and writes the briefing.</text><text x="785" y="626" text-anchor="start" font-size="15" font-weight="400" fill="#6a7488">If a tool fails, it reports "unavailable" and the loop goes on.</text><text x="785" y="648" text-anchor="start" font-size="15" font-weight="400" fill="#6a7488">The briefing is still written and sent.</text>
</svg>