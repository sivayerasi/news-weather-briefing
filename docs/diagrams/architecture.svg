<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="710" viewBox="0 0 1500 710" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Architecture</title>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker>
</defs>
<rect width="1500" height="710" fill="#ffffff"/>
<text x="750" y="44" text-anchor="middle" font-size="28" font-weight="700" fill="#1d2433">How the Daily Briefing works (AWS architecture)</text><rect x="40" y="270" width="210" height="110" rx="14" fill="#e7edff" stroke="#3b5bdb" stroke-width="2.5"/><text x="145.0" y="319.0" text-anchor="middle" font-size="21" font-weight="700" fill="#1d2433">Web page</text><text x="145.0" y="343.0" text-anchor="middle" font-size="15" fill="#495057">you type city,</text><text x="145.0" y="361.0" text-anchor="middle" font-size="15" fill="#495057">interests, email</text><rect x="310" y="270" width="200" height="110" rx="14" fill="#efe9ff" stroke="#6741d9" stroke-width="2.5"/><text x="410.0" y="319.0" text-anchor="middle" font-size="21" font-weight="700" fill="#1d2433">API Gateway</text><text x="410.0" y="343.0" text-anchor="middle" font-size="15" fill="#495057">the front door</text><rect x="580" y="215" width="260" height="180" rx="14" fill="#efe9ff" stroke="#6741d9" stroke-width="2.5"/><text x="710.0" y="299.0" text-anchor="middle" font-size="21" font-weight="700" fill="#1d2433">Lambda</text><text x="710.0" y="323.0" text-anchor="middle" font-size="15" fill="#495057">the program that runs</text><text x="710.0" y="341.0" text-anchor="middle" font-size="15" fill="#495057">the agent (Python)</text><rect x="580" y="80" width="260" height="90" rx="14" fill="#efe9ff" stroke="#6741d9" stroke-width="2.5"/><text x="710.0" y="119.0" text-anchor="middle" font-size="21" font-weight="700" fill="#1d2433">EventBridge</text><text x="710.0" y="143.0" text-anchor="middle" font-size="15" fill="#495057">alarm clock: every day</text><text x="710.0" y="161.0" text-anchor="middle" font-size="15" fill="#495057">at 7:00 AM IST</text><rect x="1000" y="70" width="290" height="90" rx="14" fill="#fff1e0" stroke="#e8590c" stroke-width="2.5"/><text x="1145.0" y="109.0" text-anchor="middle" font-size="21" font-weight="700" fill="#1d2433">Bedrock (Claude AI)</text><text x="1145.0" y="133.0" text-anchor="middle" font-size="15" fill="#495057">writes the briefing,</text><text x="1145.0" y="151.0" text-anchor="middle" font-size="15" fill="#495057">chooses which tools to use</text><rect x="1000" y="200" width="290" height="80" rx="14" fill="#f1f3f5" stroke="#6a7488" stroke-width="2.5"/><text x="1145.0" y="234.0" text-anchor="middle" font-size="21" font-weight="700" fill="#1d2433">Open-Meteo</text><text x="1145.0" y="258.0" text-anchor="middle" font-size="15" fill="#495057">real weather data</text><rect x="1000" y="320" width="290" height="80" rx="14" fill="#f1f3f5" stroke="#6a7488" stroke-width="2.5"/><text x="1145.0" y="354.0" text-anchor="middle" font-size="21" font-weight="700" fill="#1d2433">Google News</text><text x="1145.0" y="378.0" text-anchor="middle" font-size="15" fill="#495057">real news headlines</text><rect x="1000" y="440" width="290" height="80" rx="14" fill="#f1f3f5" stroke="#6a7488" stroke-width="2.5"/><text x="1145.0" y="474.0" text-anchor="middle" font-size="21" font-weight="700" fill="#1d2433">OpenStreetMap</text><text x="1145.0" y="498.0" text-anchor="middle" font-size="15" fill="#495057">backup: finds a town's location</text><rect x="580" y="480" width="260" height="110" rx="14" fill="#e6f7ec" stroke="#2b8a3e" stroke-width="2.5"/><text x="710.0" y="529.0" text-anchor="middle" font-size="21" font-weight="700" fill="#1d2433">DynamoDB</text><text x="710.0" y="553.0" text-anchor="middle" font-size="15" fill="#495057">database: saved settings</text><text x="710.0" y="571.0" text-anchor="middle" font-size="15" fill="#495057">+ audit log of every run</text><rect x="1000" y="590" width="200" height="80" rx="14" fill="#e3f6f5" stroke="#0b7285" stroke-width="2.5"/><text x="1100.0" y="624.0" text-anchor="middle" font-size="21" font-weight="700" fill="#1d2433">SES</text><text x="1100.0" y="648.0" text-anchor="middle" font-size="15" fill="#495057">sends the email</text><rect x="1290" y="590" width="180" height="80" rx="14" fill="#e3f6f5" stroke="#0b7285" stroke-width="2.5"/><text x="1380.0" y="624.0" text-anchor="middle" font-size="21" font-weight="700" fill="#1d2433">Your inbox</text><text x="1380.0" y="648.0" text-anchor="middle" font-size="15" fill="#495057">daily briefing</text><line x1="250" y1="325" x2="308" y2="325" stroke="#495057" stroke-width="2.5" marker-end="url(#a)"/><text x="279.0" y="312" text-anchor="middle" font-size="14" fill="#343a40" font-style="italic">request</text><line x1="510" y1="325" x2="578" y2="325" stroke="#495057" stroke-width="2.5" marker-end="url(#a)"/><line x1="710" y1="172" x2="710" y2="213" stroke="#495057" stroke-width="2.5" marker-end="url(#a)"/><text x="790" y="198" text-anchor="middle" font-size="14" fill="#343a40" font-style="italic">starts the run</text><line x1="840" y1="250" x2="998" y2="120" stroke="#495057" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"/><line x1="840" y1="285" x2="998" y2="240" stroke="#495057" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"/><line x1="840" y1="325" x2="998" y2="360" stroke="#495057" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"/><line x1="840" y1="365" x2="998" y2="480" stroke="#495057" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)" stroke-dasharray="7 5"/><line x1="710" y1="395" x2="710" y2="478" stroke="#495057" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"/><line x1="800" y1="395" x2="998" y2="625" stroke="#495057" stroke-width="2.5" marker-end="url(#a)"/><line x1="1200" y1="630" x2="1288" y2="630" stroke="#495057" stroke-width="2.5" marker-end="url(#a)"/><text x="40" y="520" text-anchor="start" font-size="17" font-weight="700" fill="#1d2433">Two ways to start a briefing:</text><text x="40" y="548" text-anchor="start" font-size="16" font-weight="400" fill="#343a40">1. You press Preview now on the web page.</text><text x="40" y="574" text-anchor="start" font-size="16" font-weight="400" fill="#343a40">2. The daily alarm fires at 7:00 AM IST.</text><text x="40" y="612" text-anchor="start" font-size="15" font-weight="400" fill="#6a7488">Dashed line = only used as a backup.</text><text x="40" y="636" text-anchor="start" font-size="15" font-weight="400" fill="#6a7488">No passwords in the code: AWS gives the Lambda</text><text x="40" y="656" text-anchor="start" font-size="15" font-weight="400" fill="#6a7488">permission to use the AI, the database and email.</text>
</svg>